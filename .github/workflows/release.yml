name: Release Android app

# Push a tag like v0.1.2 to build the signed APK, attach it to a GitHub release and list it on the web site's download page.
# Repo secrets needed:
#   ANDROID_KEYSTORE_BASE64  the release keystore, base64-encoded (base64 -w0 galileo-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   WEB_REPO_TOKEN           fine-grained PAT with Contents read/write on gordtulloch/Galileo.web
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Unit tests
        working-directory: android
        run: ./gradlew :core:test :quest-logic:test --no-daemon
      - name: Build the signed APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk "out/Galileo-MobileConnect-${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify it is signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs out/*.apk | tee cert.txt
          ! grep -q "Android Debug" cert.txt
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: docs/android/release-notes.md
      - name: List it on the web site
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git clone "https://x-access-token:${{ secrets.WEB_REPO_TOKEN }}@github.com/gordtulloch/Galileo.web.git" web
          python3 web/scripts/update_apps.py android "MobileConnect for Android (testing)" "${{ steps.apk.outputs.version }}" "$GITHUB_REF_NAME" out/*.apk web/downloads.json
          cd web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git diff --cached --quiet || git commit -m "Downloads: MobileConnect ${GITHUB_REF_NAME}"
          git push
