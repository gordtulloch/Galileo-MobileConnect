plugins {
    id 'com.android.application'
}

android {
    namespace 'org.galileo.questatlas'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.galileo.questatlas'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1-spike'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-O3'
            }
        }
    }

    buildFeatures { prefab true }

    // Play-policy lint (target SDK age etc.) is irrelevant to a sideloaded spike.
    lint { checkReleaseBuilds false }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        // Optimised native code, signed with the debug key so adb can install it
        // directly; this is a sideloaded measurement build, not a store release.
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43'
}
